name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (for CDK/Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            infra/package-lock.json
            apps/elder-web/package-lock.json

      - name: Setup Python (for Backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install ruff pytest pytest-cov
          if [ -f services/core-api/requirements.txt ]; then
            pip install -r services/core-api/requirements.txt
          fi

      - name: Python Lint
        run: |
          if [ -d services/ ]; then
            ruff check services/ --output-format=github
          fi
        continue-on-error: false

      - name: Python Format Check
        run: |
          if [ -d services/ ]; then
            ruff format --check services/
          fi

      - name: Python Unit Tests
        run: |
          if [ -d services/core-api/tests ]; then
            pytest services/core-api/tests/ --cov --cov-report=xml
          fi

      - name: CDK Lint & Synth
        working-directory: infra
        run: |
          npm ci
          npx tsc --noEmit
          npx cdk synth --quiet

      - name: Frontend Build Check
        working-directory: apps/elder-web
        run: |
          npm ci
          npx next build

      - name: Security Scan (dependencies)
        run: |
          pip install pip-audit
          if [ -f services/core-api/requirements.txt ]; then
            pip-audit -r services/core-api/requirements.txt || true
          fi

  cdk-diff:
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            infra/package-lock.json
            apps/elder-web/package-lock.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ap-northeast-1

      - name: CDK Diff
        working-directory: infra
        run: |
          npm ci
          npx cdk diff --all -c env=dev 2>&1 | tee /tmp/cdk-diff.txt

      - name: Comment PR with CDK Diff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diff = fs.readFileSync('/tmp/cdk-diff.txt', 'utf8');
            const body = `## CDK Diff (dev)\n\`\`\`\n${diff.slice(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
