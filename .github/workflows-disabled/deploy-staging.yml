name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (git SHA)'
        required: true
        type: string
      run_e2e:
        description: 'Run full E2E tests'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Deploy (Staging)
        working-directory: infra
        run: |
          npm ci
          npx cdk deploy --all -c env=staging --require-approval never

      - name: Run DB Migration
        run: |
          echo "TODO: Run migration against staging DB"

      - name: E2E Tests
        if: inputs.run_e2e
        run: |
          echo "TODO: Run E2E test suite"
          # pytest tests/e2e/ --env=staging

      - name: Security Negative Tests
        run: |
          echo "TODO: Run cross-elder isolation, consent bypass tests"

      - name: Create Release Manifest
        run: |
          echo "{
            \"release_id\": \"rc-${{ inputs.image_tag }}\",
            \"environment\": \"staging\",
            \"git_sha\": \"${{ inputs.image_tag }}\",
            \"deployed_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"status\": \"deployed\"
          }" > release-manifest.json
          cat release-manifest.json
