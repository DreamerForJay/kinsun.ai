openapi: 3.1.0

info:
  title: kinsun.ai Agent Runtime
  version: "1.0.0"
  summary: Agent execution and staging RAG retrieval for the smart eldercare AI companion system.
  description: |
    Contract for the endpoints that are ACTUALLY IMPLEMENTED in
    `services/agent-runtime`. Every path can be exercised against a running
    instance with no database, AWS credentials or network access: the local
    agent path is deterministic, while unconfigured retrieval fails closed with
    an explicit no-guess fallback. A successful AWS-backed retrieval requires
    separately supplied staging configuration and credentials.

    What this service does NOT do yet, despite `contracts/schemas/` containing
    shapes for them: execute tools, extract care events, create memory
    candidates, query Neptune, or hand off between agents.
    `HandoffEnvelopeV1`, `ToolRequestV1` and `ToolResponseV1` are target shapes
    and are deliberately absent from this document.

    `POST /api/v1/rag/retrievals` is staging-only. When its Bedrock and
    OpenSearch adapters are configured it retrieves approved chunks; when they
    are unavailable it returns HTTP 200 with `data.status = FAILED`, no partial
    results, and an explicit fallback message. It does not make the staging
    index a production projection or evidence that source review is complete.

    Model output comes from `MockModelProvider` — deterministic, local, and not
    a language model. Nothing here is evidence that a Bedrock-backed runtime
    behaves the same way.

    Safety behaviour worth knowing before integrating: a high-risk request is
    answered with HTTP 200 whose `data.result_status` is `BLOCKED` and whose
    `data.reply_text` is a safe replacement message. Refusal is a conversational
    outcome, not a transport error — the elder still receives a reply.

servers:
  - url: http://localhost:8000
    description: Local development (uvicorn --app-dir src agent_runtime.app:app)

tags:
  - name: operations
    description: Liveness probe. Unauthenticated.
  - name: agent
    description: Agent execution.
  - name: rag
    description: Fail-closed retrieval from the approved staging knowledge index.

paths:
  /health:
    get:
      tags: [operations]
      operationId: getAgentRuntimeHealth
      summary: Process liveness
      description: |
        Returns 200 for as long as the process is alive. Touches no dependency,
        so it stays meaningful when the model provider is unavailable.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, service, version]
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: agent-runtime
                  version:
                    type: string
                    description: API contract version the process reports.
              example:
                status: ok
                service: agent-runtime
                version: "1.0.0"

  /api/v1/agent/runs:
    post:
      tags: [agent]
      operationId: createAgentRun
      summary: Run one agent turn
      description: |
        Builds a context manifest, produces a companion reply, evaluates it
        against the safety rules, and returns the result.

        An explicit `purpose` of `general_information` or `legal_reference`
        first runs staging RAG. Three to five complete cited chunks are added
        to the in-memory context and every source is appended to an allowed
        reply. `NO_DATA`, provider failure, or missing retrieval configuration
        returns `SAFE_FALLBACK` without asking the model to guess.

        `max_steps` is the caller's own ceiling. It must not exceed the server's
        `MAX_AGENT_DECISIONS`; asking for more is a 422, not a silent clamp.
        The companion decision always spends exactly one model step.

        When `allowed_tools` explicitly includes `create_event_candidate`, a
        safety-allowed turn may run one deterministic extraction. Only if a
        Candidate exists does the Runtime register a Core-owned AgentRun, use
        that UUID in the allowlisted Core Tool request, and synchronously
        complete the same run. Tool `SUCCESS`, `NO_DATA`, and `BLOCKED` map to
        the matching terminal status; Tool `FAILED` and dependency failures map
        to `DEPENDENCY_FAILED`, while timeout and cancellation map to
        `TIME_BUDGET_EXCEEDED` and `CANCELLED`.

        The caller's existing Authorization value is forwarded unchanged to
        every Core call; the Runtime does not create credentials or trust
        actor/tenant fields in the body. Missing Core configuration, rejected
        registration, Tool transport/protocol failure, or terminal-completion
        failure returns a sanitized 503 and never falls back to a local UUID.
        Known Tool failures are completed best-effort before returning 503.

        Tool execution additionally requires UUID-form `session_id` and
        `elder_id`, plus a positive-integer string `consent_version`; Core
        revalidates SYSTEM_SERVICE identity, tenant/elder/session/policy scope,
        active consent, authorization, idempotency, and Tool allowlisting.

        The request body carries elder transcript. It is never echoed back in
        error responses and never written to general logs.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunRequestV1"
      responses:
        "200":
          description: |
            The turn completed. This includes safety-blocked turns — check
            `data.result_status` and `data.safety_result.decision`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/AgentRunResponseV1"
                  meta:
                    $ref: "#/components/schemas/ResponseMetaV1"
              example:
                data:
                  schema_version: "1.0.0"
                  request_id: req-001
                  trace_id: trace-001
                  agent_run_id: run-3f1b2c9e-5d47-4a1e-9c33-7b0a5e2d8f41
                  selected_agent: companion-agent
                  reply_text: 知道了，您今天早餐吃了粥。還有其他想和我分享的事情嗎？
                  reply_language: zh-TW
                  safety_result:
                    schema_version: "1.0.0"
                    decision: ALLOW
                    risk_level: LOW
                    reason_codes: [ALLOW]
                    matched_terms: []
                    safe_reply: null
                  context_manifest_id: id-8c2d4e6a-1b39-4f57-a0d2-6e8b3c5a7d19
                  step_count: 1
                  result_status: SUCCESS
                  reason_codes: [ALLOW]
                meta:
                  correlation_id: 4d9f2a71-6c38-4e5b-9a02-1f7d3e8c5b64
                  timestamp: "2026-07-31T04:12:09.482714Z"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            A requested Candidate write could not safely register its Core
            AgentRun or complete the Core Tool gate. No write is attempted with
            a locally generated run ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelopeV1"
              example:
                error:
                  code: service_unavailable
                  message: Core Tool execution is unavailable
                  correlation_id: 4d9f2a71-6c38-4e5b-9a02-1f7d3e8c5b64
                  reason_code: CORE_EXECUTION_UNAVAILABLE
                  retryable: true
                  details: null

  /api/v1/rag/retrievals:
    post:
      tags: [rag]
      operationId: retrieveRagKnowledge
      summary: Retrieve approved staging knowledge chunks
      description: |
        Runs bounded staging retrieval and returns three to five cited chunks
        only when enough eligible evidence is available. The retrieval layer
        applies its fixed current-status and normal-RAG safety filters; callers
        cannot submit OpenSearch DSL or bypass those filters.

        Provider absence, provider failure, or insufficient evidence is a
        knowledge outcome rather than permission for the Agent to improvise.
        It is therefore returned as HTTP 200 in the standard success envelope,
        with `data.status` set to `FAILED` or `NO_DATA`, `data.results` empty,
        and a non-empty `data.fallback_message`. The query is never copied into
        the fallback or validation response.

        This endpoint is staging-only. It does not execute production indexing
        and does not prove that Human Review, projection, or deletion workflows
        are complete.

        Service-to-service authentication is not implemented yet. Until an
        IAM, mTLS, or token contract is approved, deploy this endpoint only on
        a controlled private network and accept `audience`/`purpose` only from
        an already-authorized internal caller.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalRequestV1"
      responses:
        "200":
          description: |
            Retrieval completed, found no eligible data, or failed closed.
            Consumers must inspect `data.status`; only `SUCCESS` contains cited
            chunks. `NO_DATA` and `FAILED` contain no partial results.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/RetrievalResponseV1"
                  meta:
                    $ref: "#/components/schemas/ResponseMetaV1"
              example:
                data:
                  schema_version: "1.0.0"
                  request_id: req-rag-001
                  status: FAILED
                  fallback_message: 知識檢索服務目前無法使用，因此不產生知識庫回答。請稍後再試或改由人工查證。
                  results: []
                meta:
                  correlation_id: 4d9f2a71-6c38-4e5b-9a02-1f7d3e8c5b64
                  timestamp: "2026-08-01T04:12:09.482714Z"
                  schema_version: "1.0"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: |
        Client-supplied correlation id. Generated server-side when absent, and
        always echoed back in the `x-correlation-id` response header and in
        `meta.correlation_id`.
      schema:
        type: string

  responses:
    ValidationFailed:
      description: |
        The body failed schema validation, or it asked for something the
        runtime's limits forbid (`max_steps` above `MAX_AGENT_DECISIONS`).
        Both arrive as `validation_error`.

        `details` is populated for schema rejection and carries the field path
        plus the rejection type. It never carries the rejected value: the body
        is elder transcript.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelopeV1"
          example:
            error:
              code: validation_error
              message: Request failed schema validation.
              correlation_id: 4d9f2a71-6c38-4e5b-9a02-1f7d3e8c5b64
              details:
                - field: body.max_steps
                  reason: greater_than_equal

    InternalError:
      description: |
        Unexpected server-side failure. The message is generic and the
        traceback is logged server-side only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelopeV1"
          example:
            error:
              code: internal_error
              message: Internal server error.
              correlation_id: 4d9f2a71-6c38-4e5b-9a02-1f7d3e8c5b64
              details: null

  schemas:
    ResponseMetaV1:
      $ref: "../schemas/common/ResponseMetaV1.json"
    ErrorEnvelopeV1:
      $ref: "../schemas/common/ErrorEnvelopeV1.json"
    AgentRunRequestV1:
      $ref: "../schemas/agent/AgentRunRequestV1.json"
    AgentRunResponseV1:
      $ref: "../schemas/agent/AgentRunResponseV1.json"
    RetrievalRequestV1:
      $ref: "../schemas/rag/retrieval-request.schema.json"
    RetrievalResponseV1:
      $ref: "../schemas/rag/retrieval-response.schema.json"

security: []
