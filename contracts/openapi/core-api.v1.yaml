{
  "openapi": "3.1.0",
  "info": {
    "title": "kinsun.ai Core API",
    "version": "1.1.0",
    "summary": "Implemented Core Domain, consent, security and outbox APIs.",
    "description": "Current executable Core API contract. Every protected operation re-evaluates tenant, elder, relationship or assignment scope. Cognito JWT verification is not yet wired; production therefore fails closed with 401 as documented by bearerAuth."
  },
  "paths": {
    "/health": {
      "get": {
        "tags": [
          "operations"
        ],
        "operationId": "getHealth",
        "summary": "Process liveness",
        "description": "Returns 200 for as long as the process is alive. Touches no database\nand requires no authentication, so it stays meaningful when the\ndatabase is down — use `/ready` to gate traffic instead.\n",
        "security": [],
        "responses": {
          "200": {
            "description": "Process is alive.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "status",
                    "uptime_seconds"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ok"
                    },
                    "uptime_seconds": {
                      "type": "integer",
                      "minimum": 0,
                      "description": "Whole seconds since process start."
                    }
                  }
                },
                "example": {
                  "status": "ok",
                  "uptime_seconds": 137
                }
              }
            }
          }
        }
      }
    },
    "/ready": {
      "get": {
        "tags": [
          "operations"
        ],
        "operationId": "getReady",
        "summary": "Readiness including database connectivity",
        "description": "Verifies the database answers `SELECT 1` within 3 seconds. Returns 503\non failure or timeout, so an orchestrator removes the instance from\nrotation rather than sending it traffic it cannot serve.\n",
        "security": [],
        "responses": {
          "200": {
            "description": "Database reachable.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "status",
                    "database"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ready"
                    },
                    "database": {
                      "type": "string",
                      "const": "connected"
                    }
                  }
                },
                "example": {
                  "status": "ready",
                  "database": "connected"
                }
              }
            }
          },
          "503": {
            "description": "Database unreachable or slower than the 3 second budget.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "status",
                    "database"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "not_ready"
                    },
                    "database": {
                      "type": "string",
                      "const": "unavailable"
                    }
                  }
                },
                "example": {
                  "status": "not_ready",
                  "database": "unavailable"
                }
              }
            }
          }
        }
      }
    },
