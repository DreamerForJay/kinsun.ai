[project]
name = "kinsun-rag-ingestion"
version = "0.1.0"
description = "Fail-closed offline staging RAG ingestion for kinsun.ai"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "opensearch-py>=2.8,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.scripts]
rag-ingestion = "rag_ingestion.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]
dev = [
    "ruff>=0.8,<0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<0.9",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["rag_ingestion"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
